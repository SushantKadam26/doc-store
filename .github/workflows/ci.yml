name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm ci
          
      - name: Compile contracts
        run: npm run compile
          
      - name: Run tests
        run: npm run test
          
      - name: Type check
        run: npx tsc --noEmit
  
  deploy-preview:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm ci
          
      - name: Deploy to preview network
        run: PRIVATE_STATE_PASSWORD='Local-Devnet-Development-Placeholder-1' npx tsx src/setup.ts -- --network preview
        env:
          PRIVATE_STATE_PASSWORD: Local-Devnet-Development-Placeholder-1
